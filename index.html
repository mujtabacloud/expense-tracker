
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f8f5">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div class="logo" aria-hidden="true">↗</div>
      <h1>Expense Tracker</h1>
      <p>Track your spending, one expense at a time.</p>
    </header>

    <section class="total-card" aria-label="Expense summary">
      <p>Total Expenses</p>
      <h2 id="total-amount">0.00</h2>
      <span>Across all recorded expenses</span>
    </section>

    <section class="form-card">
      <h2>Add an Expense</h2>

      <form id="expense-form">
        <div class="form-group">
          <label for="title">Expense Title</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="e.g. Grocery shopping"
            maxlength="100"
            required
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="amount">Amount</label>
            <input
              type="number"
              id="amount"
              name="amount"
              placeholder="0.00"
              min="0.01"
              step="0.01"
              inputmode="decimal"
              required
            >
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Education">Education</option>
              <option value="Shopping">Shopping</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required>
        </div>

        <p id="form-message" class="form-message"
           role="alert" aria-live="polite"></p>

        <button type="submit" class="add-btn">+ Add Expense</button>
      </form>
    </section>

    <section class="expenses-section">
      <div class="expenses-heading">
        <h2>Recent Expenses</h2>
        <span id="expense-count">0 expenses</span>
      </div>

      <div id="expense-list" class="expense-list">
        <!-- Expense items are added here by JavaScript. -->
      </div>

      <div id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true">🧾</div>
        <h3>No expenses yet</h3>
        <p>Add your first expense to start tracking your spending.</p>
      </div>
    </section>

    <footer>
      Your expenses are saved locally in this browser.
    </footer>
  </main>
</body>
</html>
